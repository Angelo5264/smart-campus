services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartcampus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartcampus}
      RISK_LOW_THRESHOLD: ${RISK_LOW_THRESHOLD:-0.30}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-0.70}
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
